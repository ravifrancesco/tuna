# Tuna — Portainer stack
#
# Portainer → Stacks → Add stack → paste this → set DATA_BASE_PATH → Deploy. Then open
# http://<your-server>:7778: Tuna asks for Navidrome's address (and Lidarr's, if you want Get),
# with the setup code from its log. Sign in with a Navidrome account.
#
# Already run Navidrome and Lidarr? Delete those two services below and give Tuna their addresses.
# Tuna only talks to them through their APIs; it never changes their settings.
#
# DATA_BASE_PATH is the same data folder Sonarr, Radarr and qBittorrent use (mounted as /data).
# Music lives in its media/music folder: Lidarr's root folder is /data/media/music, and Navidrome
# reads it. Lidarr finds music through Prowlarr and downloads it with qBittorrent: add Lidarr as an
# app in Prowlarr, and qBittorrent as a download client in Lidarr, as you did for Sonarr.

services:
  tuna:
    image: ${TUNA_IMAGE:-ghcr.io/ravifrancesco/tuna:latest}
    container_name: Tuna
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      # All optional: easier to set in the app (Settings → Connections).
      - NAVIDROME_URL=${NAVIDROME_URL:-}
      - LIDARR_URL=${LIDARR_URL:-}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
    volumes:
      - /docker-data-volumes/tuna-data:/config # Settings, sessions and listening history
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7778:7778"
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: Navidrome
    user: "1000:1000"
    environment:
      - TZ=${TZ:-Etc/UTC}
      - ND_SCANSCHEDULE=1h
      - ND_SCANNER_WATCHERWAIT=5s
      - ND_LOGLEVEL=info
      - ND_DATAFOLDER=/config
      - ND_MUSICFOLDER=/data/media/music # Lidarr's root folder
    volumes:
      - /docker-data-volumes/navidrome-data:/config # Create it first, owned by 1000:1000
      - ${DATA_BASE_PATH}:/data:ro # Unified data mount, read-only
    ports:
      - "4533:4533"
    restart: unless-stopped

  lidarr:
    image: linuxserver/lidarr:latest
    container_name: Lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /docker-data-volumes/lidarr-data:/config
      - ${DATA_BASE_PATH}:/data # Unified data mount
    ports:
      - "8686:8686"
    restart: unless-stopped
