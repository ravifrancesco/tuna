# Tuna for iPhone and iPad. Generate the Xcode project with:  xcodegen generate
# (the generated Tuna.xcodeproj is checked in, so you can also just open it).
name: Tuna
options:
  bundleIdPrefix: app.tuna
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tuna:
    type: application
    platform: iOS
    sources:
      - path: Tuna
      # Shared with the other apps (apps/common): the loading animation and the offline page.
      - path: ../common/loading.html
        buildPhase: resources
      - path: ../common/offline.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tuna.music
        PRODUCT_NAME: Tuna
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Pick your Apple ID's team in Xcode → Tuna target → Signing & Capabilities.
        DEVELOPMENT_TEAM: NTCXDFHQC3
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
    info:
      path: Tuna/Info.plist
      properties:
        CFBundleDisplayName: Tuna
        # English, plus Italian (Tuna/it.lproj, and Strings.swift for the app's own words).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        # Your server is on your home network, usually over plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Tuna connects to your Tuna server on your home network.
        # The music keeps playing with the screen locked and from other apps.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
